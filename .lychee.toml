# Need this to avoid getting "bot denied"
user_agent = "Mozilla/5.0 (compatible; lychee link checker)"

max_retries = 3
retry_wait_time = 10
timeout = 30
max_concurrency = 1

exclude = [
  "^http://localhost",
  "^https://calendar\\.google\\.com/calendar",
  "^https://community\\.splunk\\.com/t5/AppDynamics-Knowledge-Base/How-to-observe-Kubernetes-deployment-of-OpenTelemetry-demo-app/ta-p/741454$",
  # Cloudflare-protected, returns 503 to bots
  "^https://coralogix\\.com/",
  "^https://www\\.gnu\\.org",
  "^https://platform\\.openai\\.com",
  "^https://www\\.robotstxt\\.org",
  "^https://community\\.splunk\\.com",
  # Slack requires a workspace session; archive links 403 for anonymous
  # clients. Referenced from CONTRIBUTING.md, so without this every pull
  # request fails the link check on an inherited error.
  "^https://cloud-native\\.slack\\.com/",
]

exclude_path = [
  "CHANGELOG\\.md",
]
