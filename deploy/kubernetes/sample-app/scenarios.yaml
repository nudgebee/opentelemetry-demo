#
# Which otel-demo failure scenarios NudgeBee actually detects, and how.
#
# Every entry below was measured against a live cluster on 2026-08-26, not
# inferred from the flag names. Several flags that sound useful do nothing at
# all, and the reason is never visible from the UI -- so this file records the
# negative results just as carefully as the positive ones. A scenario that
# silently does nothing is worse than one that plainly fails, because the
# natural conclusion is "the monitoring missed it".
#
# ---------------------------------------------------------------------------
# THE SINGLE MOST IMPORTANT FACT
# ---------------------------------------------------------------------------
# Only FOUR workloads in this demo emit gRPC server metrics at all:
#
#     ad, checkout, product-catalog   (+ jaeger, which is not an app service)
#
# Verified with:
#   group by (service_name) (
#     {__name__=~"rpc_server_duration_count|rpc_server_call_duration_count",
#      namespace="demo"} )
#
# cart, payment, currency, shipping, recommendation, quote and email emit NONE.
# Every OtelDemoGRPC*ErrorRate rule is therefore structurally incapable of
# firing for them, no matter how hard their flag fails. When one of those
# services breaks, it is only ever visible on its CALLER (usually checkout).
#
# Plan demos around product-catalog, checkout and the OOM/Kubernetes path.
#
# ---------------------------------------------------------------------------
# TWO SEMANTIC CONVENTIONS ARE IN PLAY
# ---------------------------------------------------------------------------
# ad and checkout still emit rpc_server_duration with a numeric
# rpc_grpc_status_code ("0" is OK). product-catalog emits rpc_server_call_duration
# with a string rpc_response_status_code ("OK"). The label sets are incompatible,
# which is why alerts/otel-demo-alerts.yaml carries two near-identical rules
# instead of one. Deleting either silences half the demo.

namespace: demo
verified_against:
  date: "2026-08-26"
  demo_version: "3.0.0 images (chart 0.41.0)"
  note: >
    cart and product-catalog ran fork-built images from 2.2.0 source at the time
    of testing. Entries marked version_dependent change once the 3.0.0 sync lands
    and those images are rebuilt.

# How to read `status`:
#   works            triggered, manifested, and NudgeBee raised an event
#   works_indirectly manifests and is detected, but on a DIFFERENT service
#   no_signal        manifests, but nothing in this stack can see it
#   silent_noop      flag is served correctly and the application ignores it

scenarios:
  - flag: postgresFailure
    variant: "on"
    service: product-catalog
    status: works
    confidence: verified
    manifests_as: Every product query returns 13 INTERNAL; storefront returns HTTP 500.
    detected_as:
      - { alert: OtelDemoGRPCServerErrorRate, on: product-catalog }
      - { alert: OtelDemoGRPCServerErrorRate, on: checkout }
    detection_time: ~2.5 min from trigger to alert firing
    objective_check: 'curl /api/products -> HTTP 500 (200 when off)'
    notes: >
      The best all-round demo. NudgeBee's RCA named the flag, quoted the exact
      error string, ruled out resource exhaustion using CPU evidence, and
      correlated the checkout alert as cascading 29 seconds later. Triage scored
      it only 27 / P3 despite being a total catalog outage -- worth knowing
      before you present it.

  - flag: postgresSlow
    variant: 6sec
    service: product-catalog
    status: works
    confidence: verified
    manifests_as: Product queries take ~6.8s (baseline ~0.8s); the delay is real DB time via pg_sleep.
    detected_as:
      - { alert: OtelDemoPostgresQueryLatencyHigh, on: product-catalog }
      - { alert: OtelDemoHighLatency, note: "p95 > 5s; use 6sec, NOT 1sec or 3sec" }
    objective_check: 'curl /api/products -> time_total > 6s'
    notes: >
      The dependency-correlation demo. The symptom rules only ever alert on a
      slow dependency's CALLERS, so a slow database looks like several slow
      services with nothing naming the cause. OtelDemoPostgresQueryLatencyHigh
      closes that by alerting on DB time itself and carrying db_system_name.
      Do not switch this to a quantile rule -- see alerts/README.md for why the
      bucket boundaries make histogram_quantile meaningless here.

      WAIT ~10 MIN BEFORE JUDGING THE RCA. The investigation runs a fast pass
      then a deeper pass that overwrites it in place, and nothing in the UI
      says which one you are reading. Measured 2026-08-26: alert 17:45:34,
      early pass said "Undetermined -- insufficient evidence", final
      investigation written 17:54:38 and named SELECT pg_sleep($1) against
      astronomy-db with two trace IDs, a healthy-query comparison
      (140-330us) and CPU ruled out at 0.002-0.005 cores. Best evidence
      section of any scenario here.

  - flag: emailMemoryLeak
    variant: 10000x
    service: email
    status: works
    confidence: verified
    manifests_as: Ruby/Puma heap grows per order confirmation until the 100Mi limit is hit.
    detected_as:
      - { event: OOMKilled, source: kubernetes_api_server, on: email }
      - { event: CrashLoopBackOff, source: kubernetes_api_server, on: email, after: ~75s }
    detection_time: under 30s at loadGeneratorVUs=50 (measured 15-46s)
    objective_check: 'kubectl -n demo get pod -l app.kubernetes.io/name=email -o jsonpath="{.items[0].status.containerStatuses[0].lastState.terminated.reason}" -> OOMKilled'
    notes: >
      The most deterministic scenario: no alert rules, no thresholds, no
      metric-coverage caveats -- the kernel OOM killer is the signal. Scored
      69 / P1, far above the error-rate scenarios, and the report exposes the
      full score breakdown (base 62, non_prod -8, likely_root_cause +15).
      Raise loadGeneratorVUs to 50 to drive order volume.

      EXPECT THE RCA TO BLAME THE 100Mi LIMIT rather than the leak: "Resource
      Under-Provisioning ... no in-code memory leak when the emailMemoryLeak
      flag is off". Its evidence is anon-rss ~98.8MiB from the kernel OOM log,
      which is circular -- a container always sits near its limit when the OOM
      killer fires. Measured control (2026-08-26): leak OFF at VUs=50 is flat
      at ~55Mi over a 9 min soak, 0 restarts, so ~45Mi of real headroom. The
      100Mi limit is correct; do NOT raise it. We tried 192Mi and the leak just
      grows to fill that instead, producing the same diagnosis with a bigger
      number. Useful as a reproducible example of a confident wrong RCA.
    conflicts_with:
      - flag: paymentFailure
        why: >
          checkout calls chargeCard BEFORE sendOrderConfirmation, so any payment
          failure aborts the order before email is ever invoked and the leak gets
          no traffic. Never run these two together.

  - flag: paymentFailure
    variant: "100%"
    service: payment
    status: works_indirectly
    confidence: verified
    manifests_as: Every charge fails, so PlaceOrder fails.
    detected_as:
      - { alert: OtelDemoGRPCServerErrorRate, on: checkout, rpc: oteldemo.CheckoutService/PlaceOrder }
    notes: >
      Detected on checkout, NOT on payment. payment emits no gRPC server metrics
      at all, so no rule can fire against it directly. This is fine for a
      blast-radius story -- the caller lights up and the failing dependency does
      not -- but do not promise an alert "on payment".

  - flag: adFailure
    variant: "on"
    service: ad
    status: silent_noop
    confidence: verified
    version_dependent: true
    manifests_as: Nothing. GetAds keeps succeeding.
    notes: >
      Measured: GetAds ran at 0.093 req/s OK against 0.0033 req/s UNAVAILABLE --
      a 3.4% error rate that PRE-DATES enabling the flag, so it is background
      noise, not the scenario. If adFailure worked the ratio would be ~100%.
      The ad service cannot re-establish its gRPC connection to flagd after a
      restart, so it never observes flag changes; OtelDemoGRPCClientErrorRate is
      concurrently firing on ad for flagd.evaluation.v2.Service/EventStream,
      which is the same root cause. Tracked upstream in fork PR #476, with PR
      #478 excluding EventStream from that alert. Re-test after both land.

  - flag: cartFailure
    variant: "100%"
    service: cart
    status: silent_noop
    confidence: verified
    version_dependent: true
    manifests_as: Nothing.
    notes: >
      Two independent reasons, either of which alone would be fatal.
      (1) TYPE MISMATCH: flagd serves cartFailure as a NUMBER (variants became
      percentages in demo 3.0.0) while the deployed cart image, built from 2.2.0
      source, calls GetBooleanValueAsync. OpenFeature returns the default and the
      flag does nothing, with no error logged anywhere. Confirmed via
      `scenario.sh --check cartFailure` -> value: 1, variant: "100%", while cart
      behaved normally. (2) Even once fixed, cart emits no gRPC server metrics,
      so it can only ever surface via its caller.

      SOURCE IS NOW FIXED, IMAGES MAY NOT BE. The 3.0.0 sync moved cart to
      GetDoubleValueAsync, so (1) is resolved in this repo. The deployed image
      is a different question: `latest-cart` only picks the fix up once CI
      rebuilds it, so a cluster running an older pull still shows the silent
      no-op. Confirm with `scenario.sh --check cartFailure` plus an actual
      EmptyCart before assuming it works. (2) is unchanged either way -- cart
      still emits no server metrics, so detection remains caller-side only.

  - flag: productCatalogFailure
    variant: "on"
    service: product-catalog
    status: silent_noop
    confidence: verified
    manifests_as: Nothing. It cannot be enabled at all.
    notes: >
      BROKEN UPSTREAM, not a NudgeBee gap. The flag ships with a targeting rule
      whose branches BOTH return "off":
        {"if": [{"==": [{"var": "product_id"}, "OLJCESPC7Z"]}, "off", "off"]}
      Targeting outranks defaultVariant, so setting the flag on changes nothing
      and GetProduct keeps succeeding -- verified with 8 consecutive HTTP 200s
      against OLJCESPC7Z while the flag read "on". Byte-identical in upstream
      chart 0.41.0 and this fork's src/flagd, so it is upstream's definition and
      presumably meant to be ["on", "off"].
      `scenario.sh --check` shows reason=TARGETING_MATCH for it, and
      `scenario.sh --targeting productCatalogFailure` reports it as degenerate.
      Use postgresFailure instead -- same service, same detection path, and it
      actually works.

  - flag: recommendationCacheFailure
    variant: "on"
    service: recommendation
    status: no_signal
    confidence: expected
    manifests_as: Unbounded cache growth plus RPC errors.
    notes: >
      recommendation emits no gRPC server metrics, so the error path is invisible.
      values.yaml tightens its memory limit to 250Mi specifically so the cache
      growth reaches OOMKill, which WOULD be detected via the Kubernetes path
      like emailMemoryLeak. Needs a longer soak than email under demo traffic.

  - flag: adHighCpu
    variant: "on"
    service: ad
    status: no_signal
    confidence: expected
    notes: >
      values.yaml sets a 200m CPU limit on ad so the busy-loop produces
      container_cpu_cfs_throttled metrics rather than merely eating node CPU.
      There is no CPU alert rule in alerts/, so throttling is visible in metrics
      but raises no event by itself. Also gated behind the same broken ad->flagd
      connection as adFailure, so it cannot be trusted until PR #476 lands.

  - flag: failedReadinessProbe
    variant: "on"
    service: cart
    status: no_signal
    confidence: expected
    version_dependent: true
    notes: >
      Genuinely wired in this fork -- cart's gRPC health check reads the flag and
      Program.cs exposes an HTTP /healthz on 8081 for the kubelet, because the
      chart schema only accepts httpGet probes. Expected to surface as a pod
      Unhealthy/NotReady event via the Kubernetes path. Not re-tested here, and
      subject to the same cart flag-plumbing caveats above.

  - flag: imageSlowLoad
    variant: 10sec
    service: frontend
    status: no_signal
    confidence: verified_previously
    notes: >
      The delay is injected by Envoy fault injection on a BROWSER-side fetch of
      /images/products/*, served by the nginx image-provider. OtelDemoHighLatency
      keys on backend http_server_request_duration, which never observes it. It
      is real and visible in traces, but no alert can see it. Do not put this in
      a scripted demo.

  - flag: kafkaQueueProblems
    variant: "on"
    service: kafka
    status: no_signal
    confidence: expected
    notes: >
      Produces consumer lag on accounting / fraud-detection. Neither emits gRPC
      server metrics and there is no lag alert rule, so detection would depend on
      a consumer OOMKilling. accounting's limit was already raised to 256Mi to
      stop it OOMKilling spuriously, which makes that outcome less likely.

  - flag: paymentUnreachable
    variant: "on"
    service: payment
    status: works_indirectly
    confidence: verified
    detected_as:
      - { alert: OtelDemoGRPCServerErrorRate, on: checkout, rpc: oteldemo.CheckoutService/PlaceOrder }
    detection_time: ~2m40s from trigger to alert firing
    notes: >
      Same shape and same caveat as paymentFailure -- visible on checkout only,
      never on payment, which emits no gRPC server metrics. Verified in
      ISOLATION: all other flags off and every OtelDemo alert confirmed resolved
      first, because a preceding paymentFailure run keeps the same checkout alert
      firing continuously and would otherwise have been miscredited to this flag.

  - flag: adManualGc
    variant: "on"
    service: ad
    status: no_signal
    confidence: expected
    notes: GC pauses are unlikely to push p95 past the 5s threshold, and it is gated behind the broken ad->flagd connection.

  - flag: intlShippingSlowdown
    variant: 10sec
    service: shipping
    status: no_signal
    confidence: expected
    notes: New in demo 3.0.0. shipping emits no gRPC server metrics; would only show on a caller if it pushes p95 over 5s.

# Traffic controls, not faults. scenario.sh --reset deliberately leaves these
# alone: switching them off leaves the demo idle, after which every scenario
# looks like it did nothing.
traffic_controls:
  - flag: loadGeneratorTraffic
    note: master switch for synthetic traffic; keep "on".
  - flag: loadGeneratorVUs
    note: >
      5 by default. Raise to 50 to drive order volume for emailMemoryLeak and
      recommendationCacheFailure, then put it back -- it is a shared cluster.

# Removed in demo 3.0.0 along with src/llm. Listed only so nobody reinstates
# them from an older guide: they had zero consumers even when they existed.
retired_flags: [llmRateLimitError, llmInaccurateResponse, loadGeneratorFloodHomepage]
