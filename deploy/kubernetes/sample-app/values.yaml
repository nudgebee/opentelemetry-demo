# OpenTelemetry demo values for testing NudgeBee.
#
# PORTABLE. Nothing here refers to any particular cluster, monitoring stack or
# namespace, so it works as-is anywhere. Every setting exists for one of two
# reasons: to make a scenario detectable, or to make it detectable FAST. If you
# are tempted to drop something, check `scenarios.yaml` first -- several of
# these are the only reason a given scenario produces a signal at all.
#
# Observability backends are deliberately left at CHART DEFAULTS (the demo's own
# collector, Prometheus, Grafana, Jaeger and OpenSearch all stay enabled). That
# keeps the demo self-contained and working out of the box, and lets NudgeBee's
# agent scrape it independently. Disabling them is an optimisation for people who
# already run a stack, not a prerequisite -- see values-external-stack.example.yaml for a
# worked example of doing that.
#
#   helm upgrade --install otel-demo open-telemetry/opentelemetry-demo \
#     --namespace demo --create-namespace \
#     -f deploy/kubernetes/sample-app/values.yaml
#
# Overrides use `envOverrides` rather than `env` so they upsert into the chart's
# default env list instead of replacing it. That stops this file breaking every
# time the chart adds a new variable.

default:
  envOverrides:
    # Set resource attributes for service discovery and grouping
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: 'service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version={{ .Chart.AppVersion }}'
    # Export metrics every 15s instead of the OTel SDK default of 60s.
    #
    # This is the dominant factor in how fast a scenario becomes visible. At the
    # 60s default every series gets one sample per minute (verified:
    # count_over_time(...[10m]) returned 10), so a rate() window needs minutes
    # just to collect enough points, and no alert could fire in under ~7 min no
    # matter how the rules were tuned. The 10s Prometheus scrape interval was
    # irrelevant - there was simply nothing new to scrape.
    #
    # At 15s a 2m rate window holds ~8 samples, so the alert expressions cross
    # their thresholds in well under a minute. Cost is 4x more metric exports,
    # which is immaterial at demo scale.
    - name: OTEL_METRIC_EXPORT_INTERVAL
      value: "15000"

# Per-component infrastructure overrides.
#
# Three distinct motivations grouped here:
#
#  1. Resource hygiene transition (`product-catalog`) — preserved from the
#     prior `requests: 128Mi → 20Mi` move; strategic merge patch can't clear
#     the old request, so we set both requests + limits explicitly until the
#     old ReplicaSet is gone.
#
#  2. Wire k8s probes + CPU limits so the otel-demo feature flags that
#     SIMULATE problems can actually MANIFEST as k8s-visible signals. The
#     application code respects these flags (e.g. cart's gRPC health check
#     reads `failedReadinessProbe`; ad burns CPU on `adHighCpu`), but with
#     no probe wired and no CPU limit set, the resulting failures stay
#     invisible to k8s — no `Unhealthy` event, no throttling metric. The
#     monitoring stack can't surface what k8s never observes. These additions
#     close that gap for the matrix scenarios we measured.
#
#  3. Ship this fork's own feature flags (`flagd`) so the postgres scenarios
#     are part of the installable pack instead of a manual cluster patch.
components:
  # flagd — seed the live flag file with this fork's postgres fault-injection
  # flags, so they survive ArgoCD syncs and ship with the pack.
  #
  # Why this is done in an init container rather than as flag files: the chart
  # builds the `flagd-config` ConfigMap from files bundled INSIDE the chart
  # (`(.Files.Glob "flagd/*.json").AsConfig`), so no values override can add a
  # flag there, and the ConfigMap name is fixed — a second ConfigMap would just
  # collide. The init container that seeds flagd's writable copy IS values-driven,
  # so we inject there. The flags land in the same `/config-rw/demo.flagd.json`
  # that flagd-ui edits, so they stay toggleable from the UI like the built-ins.
  # Without this they existed only as a hand-patched ConfigMap that any sync wiped.
  #
  # `sed r` appends after the `"flags": {` line, leaving the chart's own flags
  # authoritative — new upstream flags flow through untouched. Injection is
  # skipped when the source already defines the flags, so the step stays
  # idempotent and never emits duplicate JSON keys. The greps fail the init
  # container loudly if that anchor ever changes, rather than silently starting
  # flagd without the postgres flags.
  flagd:
    initContainers:
      - name: init-config
        # Pinned rather than the chart default's floating `busybox`, so the
        # flag-seeding step stays reproducible across deploys.
        image: busybox:1.36.1
        command:
          - sh
          - -c
          - |
            cat > /tmp/postgres-flags.json <<'FLAGS'
                "postgresFailure": {
                  "description": "Make the product-catalog PostgreSQL dependency unavailable - every product query fails fast, driving a gRPC error rate that cascades to its callers",
                  "state": "ENABLED",
                  "variants": {
                    "on": true,
                    "off": false
                  },
                  "defaultVariant": "off"
                },
                "postgresSlow": {
                  "description": "Make every product-catalog PostgreSQL query genuinely slow via pg_sleep - variant value is the per-query delay in ms, visible as a slow DB span in traces",
                  "state": "ENABLED",
                  "variants": {
                    "off": 0,
                    "1sec": 1000,
                    "3sec": 3000,
                    "6sec": 6000
                  },
                  "defaultVariant": "off"
                },
            FLAGS
            if grep -q '"postgresFailure"' /config-ro/demo.flagd.json; then
              cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json
            else
              sed '/"flags": {/r /tmp/postgres-flags.json' /config-ro/demo.flagd.json > /config-rw/demo.flagd.json
            fi
            grep -q '"postgresFailure"' /config-rw/demo.flagd.json || exit 1
            grep -q '"postgresSlow"' /config-rw/demo.flagd.json || exit 1
            cat /config-rw/demo.flagd.json
        volumeMounts:
          - mountPath: /config-ro
            name: config-ro
          - mountPath: /config-rw
            name: config-rw

  # product-catalog — fork-built image adds the `postgresFailure` fault-injection
  # flag (stock `ghcr.io/open-telemetry/demo` has no such flag). pullPolicy Always
  # so the rolling `latest-*` tag is re-pulled on restart.
  #
  # OTEL_CONFIG_FILE override: the fork's product-catalog reads this env, but the
  # chart sets it to /otel-config.yaml while mounting the config at /otel-config.yml.
  # Point it at the real mount so otelconf.NewSDK finds the file (the stock image
  # ignored the env, so the mismatch was latent until now).
  #
  # memory bumped 20Mi → 64Mi: the fork image links the postgres driver + otelsql
  # and needs a little more headroom to start.
  product-catalog:
    # ROLLING TAG -- pin this before pointing anyone external at the lab.
    # `latest-product-catalog` is reassigned by every build, so with
    # pullPolicy: Always the application can change between two runs of the same
    # scenario, and one bad push breaks every install at once. Once a release is
    # cut (Actions -> "Release images", e.g. version `3.0.0-nudgebee.1`) replace
    # these three lines with:
    #   tag: 3.0.0-nudgebee.1-product-catalog
    #   pullPolicy: IfNotPresent
    # and update --code-commit in annotate-workloads.sh to the commit that built
    # it, or the code agent will cite source that is not what is running.
    imageOverride:
      repository: ghcr.io/nudgebee/opentelemetry-demo
      tag: latest-product-catalog
      pullPolicy: Always
    envOverrides:
      - name: OTEL_CONFIG_FILE
        value: /otel-config.yml
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 64Mi

  # cart — wire a readinessProbe so the `failedReadinessProbe` flag manifests
  # as a k8s Unhealthy event. Cart's gRPC health check already reads the flag,
  # but the chart's values.schema.json only accepts `httpGet` probes. To bridge
  # that, Program.cs adds an HTTP `/healthz` endpoint backed by the same
  # `readinessCheck` instance.
  #
  # The probe points at 8081, NOT cart's gRPC port. Cart's main port is
  # cleartext h2c and must stay HTTP/2 only: there is no ALPN to negotiate
  # with, so allowing HTTP/1.1 on it stops h2c clients connecting at all. Since
  # kubernetes httpGet probes speak HTTP/1.1, Program.cs binds a second
  # HTTP/1.1-only listener on 8081 purely for this probe, leaving the gRPC
  # listener untouched.
  #
  # imageOverride points at the fork-built image (ghcr.io/nudgebee/opentelemetry-demo)
  # because /healthz and the second listener were added in this fork; upstream
  # `ghcr.io/open-telemetry/demo` has neither and the probe would never succeed.
  cart:
    # ROLLING TAG -- see the note on product-catalog above. Pin to
    # `<version>-cart` with pullPolicy: IfNotPresent once a release is cut.
    imageOverride:
      repository: ghcr.io/nudgebee/opentelemetry-demo
      tag: latest-cart
      pullPolicy: Always
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3

  # quote — align service port with new internal convention
  quote:
    envOverrides:
      - name: QUOTE_PORT
        value: "8081"

  # ad — set a CPU limit so `adHighCpu` produces throttling metrics.
  # Without a limit, the flag's CPU burn just consumes node CPU and the
  # kubelet emits no `container_cpu_cfs_throttled_*` series. 200m gives
  # the demo headroom under normal load and gets throttled hard under
  # the flag's busy-loop.
  ad:
    resources:
      requests:
        cpu: 100m
        memory: 300Mi
      limits:
        cpu: 200m
        memory: 300Mi

  # recommendation — CPU limit + tighter memory so
  # `recommendationCacheFailure` triggers OOM in a reasonable soak window
  # under demo-shaped traffic. The cache leak grows exponentially (1.4× per
  # 50% of requests); current 500Mi limit + low locust traffic means OOM
  # takes 30+ min. Tightening to 250Mi keeps the leak scenario actionable
  # without affecting steady-state.
  recommendation:
    resources:
      requests:
        cpu: 50m
        memory: 250Mi
      limits:
        cpu: 200m
        memory: 250Mi

  # email -- CPU limit + a memory limit tight enough that the leak OOMs fast.
  #
  # 100Mi is deliberate and measured, not guesswork: with emailMemoryLeak OFF
  # at loadGeneratorVUs=50 the container is flat at ~55Mi over a 9 minute soak
  # with zero restarts, so ~45Mi of headroom. With the leak on it OOMKills in
  # well under a minute.
  #
  # Do not raise this because an RCA calls the limit under-provisioned. That
  # diagnosis cites anon-RSS at the moment of the kill (~98.8MiB), which is
  # circular -- a container always dies near its limit, whatever the limit is.
  # Raising it just moves the number the next report quotes.
  email:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 100m
        memory: 100Mi

  # accounting: the chart defaults this to a 120Mi limit, but the .NET runtime
  # sits at ~117Mi steady here (Kafka consumer + Postgres client), which leaves
  # almost no headroom and OOMKills on every GC spike (observed ~100 restarts in
  # 44h). This is not a leak: working-set is flat, not climbing. Give it real
  # headroom. Both request and limit are set to the same value so the strategic
  # merge patch never leaves a stale request above the limit (an earlier drift
  # in exactly that shape kept this Deployment permanently OutOfSync).
  accounting:
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 256Mi
