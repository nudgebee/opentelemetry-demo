# Expose the demo's metrics for YOUR Prometheus to scrape.
#
# Use this only if you specifically want pull-based collection. If you have no
# strong preference, values-remote-write.example.yaml is simpler and has fewer
# ways to go wrong -- see the label-selector warning below, which is where most
# of the lost time on this path goes.
#
# WHAT THIS DOES
# --------------
# Adds a `prometheus` exporter on the collector and publishes it as port 8889 on
# the collector Service, so a ServiceMonitor / VMServiceScrape can pick it up.
#
# It does NOT create the ServiceMonitor. That object has to carry the label your
# Prometheus selects on, which this chart cannot know. See below.
#
# USE IT
# ------
#   helm upgrade --install otel-demo open-telemetry/opentelemetry-demo \
#     --namespace demo --create-namespace \
#     -f deploy/kubernetes/sample-app/values.yaml \
#     -f deploy/kubernetes/sample-app/values-scrape.example.yaml
#
# Then create the ServiceMonitor (next section), and prove it works:
#
#   ./deploy/kubernetes/sample-app/scenario.sh --check-metrics http://<your-prometheus>:9090
#
# THE SERVICEMONITOR, AND THE LABEL THAT BREAKS IT
# ------------------------------------------------
# kube-prometheus-stack only selects ServiceMonitors carrying its own release
# label. Get it wrong and the object exists, looks correct, and is ignored --
# another silent failure. Find yours:
#
#   kubectl get prometheus -A -o jsonpath='{.items[0].spec.serviceMonitorSelector}'
#
# Then apply, substituting <kps-release> and the demo namespace:
#
#   apiVersion: monitoring.coreos.com/v1
#   kind: ServiceMonitor
#   metadata:
#     name: otel-demo-collector
#     namespace: demo
#     labels:
#       release: <kps-release>
#   spec:
#     selector:
#       matchLabels:
#         app.kubernetes.io/name: opentelemetry-collector
#     endpoints:
#       - port: promexport
#         interval: 15s
#
# On VictoriaMetrics use a VMServiceScrape instead, unless the operator is
# running with ServiceMonitor conversion enabled.
#
# Also confirm your Prometheus is allowed to select across namespaces. If
# serviceMonitorNamespaceSelector is empty it watches only its own namespace and
# will never see this one.

opentelemetry-collector:
  ports:
    promexport:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP

  config:
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        # Keeps k8s attributes (namespace, pod, deployment) as metric labels.
        # Without this the alert rules cannot select by namespace and nothing
        # fires even though the series exist.
        resource_to_telemetry_conversion:
          enabled: true

    service:
      pipelines:
        metrics:
          # Helm REPLACES lists rather than merging them, so this is the whole
          # exporter list. Dropping the chart's `otlp_http/prometheus` is
          # deliberate: it targets the bundled Prometheus, which is the dead end
          # this file exists to avoid.
          exporters:
            - prometheus
            - debug

prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false
